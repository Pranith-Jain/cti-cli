[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cti-cli"
version = "1.0.0"
description = "Command-line threat intelligence tool powered by pranithjain.qzz.io"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
cti = "cti_cli:cli"

[tool.setuptools]
py-modules = ["cti_cli"]
